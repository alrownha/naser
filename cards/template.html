<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Lalezar;src:url(fonts/lalezar.ttf)}
@font-face{font-family:Naskh;src:url(fonts/naskh.ttf)}
@font-face{font-family:Tajawal;src:url(fonts/tajawal.ttf)}
@page{size:210mm 297mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:210mm;height:297mm}
body{background:#fff8ec;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card{width:100mm;height:148mm;padding:4.76mm}
.frame{border-width:1.2mm;height:100%;border:1.09mm dashed #f4a259;background:#fffdf7;display:flex;flex-direction:column;align-items:center;padding:5.44mm 4.08mm 3.40mm}
.letter{width:28.56mm;height:28.56mm;border-radius:50%;background:#5b8e7d;color:#fff;font-family:Lalezar;font-size:23.80mm;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:4.76mm;box-shadow:0 1.09mm 0 #3f6b5c}
.spot{width:84.32mm;height:45mm;display:flex;align-items:flex-end;justify-content:center;margin-top:1.36mm}
.cow{width:73.44mm}
.word{font-family:Naskh;font-weight:700;font-size:15.64mm;line-height:1.6;color:#bc4b51}
.from{margin-top:auto;font-family:Naskh;font-size:4.42mm;color:#6b5b4b}
.from span{color:#f4a259}
.acc{margin-top:1.70mm;font-family:Tajawal;font-size:3.13mm;color:#5b8e7d;direction:ltr;letter-spacing:.2.04mm;display:flex;align-items:center;gap:1.02mm}
.acc svg{width:3.13mm;height:3.13mm}
body{background:#fff}
.sheet{width:210mm;height:297mm;overflow:hidden;display:grid;grid-template-columns:100mm 100mm;grid-template-rows:148mm 148mm;justify-content:center;align-content:center}
.card{position:relative;background:#fff8ec;outline:0.2mm dashed #bbb}
.c1{left:5mm;top:23.5mm}.c2{left:105mm;top:23.5mm}
.c3{left:30mm;top:173.5mm;transform-origin:top left;transform:translate(0,100mm) rotate(-90deg)}
.vowels{display:flex;gap:9mm;direction:rtl;font-family:Naskh;font-weight:700;font-size:10mm;line-height:1.35;color:#5b8e7d;margin-top:1mm}
.vowels span{min-width:9mm;text-align:center}
